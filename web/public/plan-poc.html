<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUSE PoC Planner</title>
<style>
:root{
  --suse-dark:#0b2e2a; --suse-base:#30ba78; --suse-base2:#28a267;
  --suse-light:#9fe8c6; --suse-accent:#ff7a59; --gray-50:#f8fafc; --gray-100:#f1f5f9;
  --gray-200:#e2e8f0; --gray-300:#cbd5e1; --gray-400:#94a3b8; --gray-500:#64748b;
  --gray-700:#334155; --gray-800:#1e293b; --gray-900:#0f172a;
  --red-500:#ef4444; --red-50:#fef2f2; --orange-500:#f97316; --orange-50:#fff7ed;
  --green-600:#16a34a; --green-50:#f0fdf4; --blue-500:#3b82f6; --blue-50:#eff6ff;
  --purple-500:#a855f7; --purple-50:#faf5ff;
  --ink:var(--suse-dark); --surface:#ffffff;
}
html[data-theme="dark"]{
  --gray-50:#101c19; --gray-100:#17251f; --gray-200:#223730; --gray-300:#35524a;
  --gray-400:#7d968d; --gray-500:#a2b8b0; --gray-700:#d2e3dc; --gray-800:#e3f0ea; --gray-900:#f3faf7;
  --red-500:#f87171; --red-50:#2c1618; --orange-500:#fb923c; --orange-50:#2c2013;
  --green-600:#4ade80; --green-50:#122c1f; --blue-500:#7fb0ff; --blue-50:#122236;
  --surface:#15241f; --ink:#7eecb0;
}
html[data-theme="dark"] body{background:#0b1512;}
html[data-theme="dark"] .alert-ok{border-color:#1f6b45;color:#9ff0c2;}
html[data-theme="dark"] .alert-warn{border-color:#9a5a1f;color:#ffcb94;}
html[data-theme="dark"] .alert-info{border-color:#3b5a85;color:#a9ccff;}
html[data-theme="dark"] .alert-danger{border-color:#8a3a3f;color:#ffb3b3;}
html[data-theme="dark"] .footer-bar{background:rgba(21,36,31,.88);}
html[data-theme="dark"] .product-card.selected{background:linear-gradient(180deg,var(--surface),var(--green-50));}
html[data-theme="dark"] .card{box-shadow:0 1px 3px rgba(0,0,0,.3);}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--gray-50);color:var(--gray-900);}
.app-shell{min-height:100vh;display:flex;flex-direction:column;padding-bottom:110px;}
.header{background:linear-gradient(135deg,#0b2e2a,#133a34);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.25);}
.header-inner{max-width:1280px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:14px;cursor:pointer;}
.brand-icon{background:var(--suse-base);padding:10px;border-radius:14px;display:flex;box-shadow:0 8px 20px rgba(48,186,120,.3);}
.brand h1{font-size:19px;font-weight:900;margin:0;letter-spacing:.02em;text-transform:uppercase;}
.brand p{font-size:10px;margin:2px 0 0;color:var(--suse-light);font-weight:700;text-transform:uppercase;letter-spacing:.15em;}
.lang-switch{display:flex;background:rgba(255,255,255,.07);padding:4px;border-radius:999px;border:1px solid rgba(255,255,255,.1);}
.lang-switch button{background:transparent;border:none;color:rgba(255,255,255,.45);font-size:11px;font-weight:900;padding:7px 12px;border-radius:999px;cursor:pointer;}
.lang-switch button.active{background:var(--suse-base);color:#fff;}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;border-radius:14px;border:none;cursor:pointer;transition:transform .15s,background .15s;font-family:inherit;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--suse-dark);color:#fff;padding:14px 26px;}
.btn-primary:hover{transform:scale(1.03);}
.btn-primary:disabled{background:var(--gray-200);color:var(--gray-400);cursor:not-allowed;transform:none;}
.btn-outline{background:var(--surface);color:var(--gray-700);border:1px solid var(--gray-200);padding:14px 24px;}
.btn-outline:hover{background:var(--gray-50);}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;padding:10px 18px;border-radius:999px;font-size:12px;}
.btn-ghost:hover{background:rgba(255,255,255,.2);}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:10px;}
.container{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:28px 24px 0;}
.card{background:var(--surface);border-radius:22px;border:1px solid var(--gray-100);box-shadow:0 1px 3px rgba(0,0,0,.04);padding:28px;}
.card + .card{margin-top:20px;}
h2.section-title{font-size:24px;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:10px;margin:0 0 6px;}
.section-sub{color:var(--gray-500);font-size:13px;margin:0 0 20px;}
.grid{display:grid;gap:18px;}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
label.field-label{display:block;font-size:11px;font-weight:800;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;padding:11px 13px;border:1px solid var(--gray-200);border-radius:12px;font-size:13.5px;font-family:inherit;outline:none;background:var(--surface);color:var(--gray-900);transition:border .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--suse-base);box-shadow:0 0 0 3px rgba(48,186,120,.15);}
input.input-error{border-color:var(--red-500);box-shadow:0 0 0 2px rgba(239,68,68,.15);}
input.input-ok{border-color:var(--green-600);}
.field-box{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:16px;padding:16px;}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:999px;}
.pill-ok{background:var(--green-50);color:var(--green-600);}
.pill-warn{background:var(--orange-50);color:var(--orange-500);}
.pill-off{background:var(--gray-100);color:var(--gray-400);}
.pill-bad{background:var(--red-50);color:var(--red-500);}
.cred-clear,.print-only{display:none;}
.product-card{position:relative;border-radius:20px;border:2px solid var(--gray-100);padding:20px;cursor:pointer;transition:all .15s;background:var(--surface);}
.product-card:hover{border-color:var(--suse-light);}
.product-card.selected{border-color:var(--suse-base);background:linear-gradient(180deg,var(--surface),var(--green-50));box-shadow:0 8px 20px rgba(48,186,120,.12);}
.product-card.standalone{border-style:dashed;}
.product-card .check{position:absolute;top:16px;right:16px;width:22px;height:22px;border-radius:999px;border:2px solid var(--gray-200);display:flex;align-items:center;justify-content:center;}
.product-card.selected .check{background:var(--suse-base);border-color:var(--suse-base);color:#fff;}
.product-badge{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;background:var(--gray-100);color:var(--gray-500);padding:2px 8px;border-radius:999px;display:inline-block;margin-top:8px;}
.nav-steps{display:flex;align-items:center;justify-content:space-between;overflow-x:auto;padding:4px 4px 18px;margin-bottom:10px;gap:0;}
.nav-step{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:84px;background:none;border:none;font-family:inherit;}
.nav-circle{width:38px;height:38px;border-radius:14px;display:flex;align-items:center;justify-content:center;border:3px solid var(--gray-200);background:var(--surface);color:var(--gray-400);font-weight:800;font-size:13px;}
.nav-step.active .nav-circle{background:var(--suse-dark);border-color:var(--suse-base);color:#fff;}
.nav-step.done .nav-circle{background:var(--suse-base);border-color:var(--suse-base);color:#fff;}
.nav-label{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-400);text-align:center;}
.nav-step.active .nav-label{color:var(--ink);}
.nav-line{flex:1;height:2px;background:var(--gray-200);margin:0 4px;align-self:flex-start;margin-top:19px;}
.nav-line.done{background:var(--suse-base);}
.footer-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:900px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border:1px solid var(--gray-100);border-radius:24px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 20px 50px -12px rgba(0,0,0,.18);z-index:90;}
table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
table.data-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-400);padding:8px 10px;border-bottom:2px solid var(--gray-100);}
table.data-table td{padding:9px 10px;border-bottom:1px solid var(--gray-100);vertical-align:middle;}
table.data-table tr:hover td{background:var(--gray-50);}
.tabs{display:flex;background:var(--gray-100);padding:5px;border-radius:16px;gap:4px;flex-wrap:wrap;}
.tab-btn{padding:9px 16px;font-size:10.5px;font-weight:900;text-transform:uppercase;border-radius:12px;border:none;background:transparent;color:var(--gray-400);cursor:pointer;font-family:inherit;}
.tab-btn.active{background:var(--surface);color:var(--ink);box-shadow:0 4px 10px rgba(0,0,0,.06);}
.badge-dot{width:8px;height:8px;border-radius:999px;display:inline-block;}
.alert{padding:14px 16px;border-radius:14px;font-size:12.5px;line-height:1.5;}
.alert-ok{background:var(--green-50);border:1px solid #bbf7d0;color:#166534;}
.alert-warn{background:var(--orange-50);border:1px solid #fed7aa;color:#9a3412;}
.alert-info{background:var(--blue-50);border:1px solid #bfdbfe;color:#1e40af;}
.alert-danger{background:var(--red-50);border:1px solid #fecaca;color:#991b1b;}
.checklist-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--gray-100);}
.checklist-item input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--suse-base);}
.icon{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.no-print{}
.arch-svg{display:block;max-width:100%;height:auto;font-family:inherit;}
.arch-svg .a-t{font-size:14px;font-weight:800;fill:var(--gray-900);}
.arch-svg .a-s{font-size:12px;fill:var(--gray-500);}
.grp-row{background:var(--gray-50);}
.test-filters{position:sticky;top:78px;z-index:60;}
select.t-compact,input.t-compact{padding:7px 9px;font-size:12px;border-radius:10px;}
.test-filters select.t-compact,.test-filters input.t-compact{width:auto;flex:1 1 130px;min-width:110px;max-width:200px;}
.text-muted{color:var(--gray-500);}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;}
.flex{display:flex;}
.flex-wrap{flex-wrap:wrap;}
.gap-2{gap:8px;}.gap-3{gap:12px;}.gap-4{gap:16px;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.mt-1{margin-top:6px;}.mt-2{margin-top:10px;}.mt-3{margin-top:16px;}.mt-4{margin-top:22px;}
.mb-2{margin-bottom:10px;}.mb-3{margin-bottom:16px;}
.w-full{width:100%;}
.text-xs{font-size:11px;}.text-sm{font-size:12.5px;}
.fade-in{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media screen and (max-width:720px){
  .header-inner{padding:12px 16px;gap:10px;}
  .header-inner > div:last-child{flex-wrap:wrap;gap:8px;}
  table.data-table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .footer-bar{width:calc(100% - 20px);padding:8px 10px;gap:6px;bottom:10px;}
  .footer-bar .btn{padding:10px 12px;}
  .footer-bar .btn-primary{padding:10px 14px;}
  .footer-bar div[style*="width:140px"]{width:56px !important;}
}
@media print{
  /* PDF sempre em papel branco, sem fundo e sem a barra do app, qualquer que seja o tema da tela.
     As cores dos selos de status e a figura da arquitetura continuam — elas carregam significado. */
  html,html[data-theme="dark"]{
    --gray-50:#f8fafc; --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-300:#cbd5e1; --gray-400:#94a3b8; --gray-500:#64748b;
    --gray-700:#334155; --gray-800:#1e293b; --gray-900:#0f172a;
    --red-500:#ef4444; --red-50:#fef2f2; --orange-500:#f97316; --orange-50:#fff7ed;
    --green-600:#16a34a; --green-50:#f0fdf4; --blue-500:#3b82f6; --blue-50:#eff6ff;
    --surface:#ffffff; --ink:#0b2e2a;
  }
  html,html[data-theme="dark"] body,body{background:#fff !important;color:#0f172a;}
  html[data-theme="dark"] .alert-ok{border-color:#bbf7d0;color:#166534;}
  html[data-theme="dark"] .alert-warn{border-color:#fed7aa;color:#9a3412;}
  html[data-theme="dark"] .alert-info{border-color:#bfdbfe;color:#1e40af;}
  html[data-theme="dark"] .alert-danger{border-color:#fecaca;color:#991b1b;}
  .no-print,.header,.footer-bar,.test-filters{display:none !important;}
  .app-shell{padding-bottom:0;}
  .container{padding-top:0;}
  .card,html[data-theme="dark"] .card{background:transparent;}
  .grp-row{background:transparent !important;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .card{page-break-inside:avoid;box-shadow:none;border:1px solid var(--gray-200);}
  .report-main .card{page-break-inside:auto;}
  .report-main .card.keep-together{page-break-inside:avoid;break-inside:avoid;}
  /* Paginação do PDF: título nunca fica sozinho no fim da página, tabelas curtas não se partem, e as
     longas quebram só entre linhas (com o cabeçalho repetido). */
  .report-main h3,.report-main h4{break-after:avoid;page-break-after:avoid;}
  .report-main :is(div,p):has(+ table){break-after:avoid;page-break-after:avoid;}
  .report-main table.data-table:not(.multi):not(:has(tbody tr:nth-child(15))){break-inside:avoid;page-break-inside:avoid;}   /* .multi = várias <tbody>, onde esta contagem não vale */
  .report-main table.data-table tr{break-inside:avoid;page-break-inside:avoid;}
  .report-main tbody.keep-head{break-inside:avoid;page-break-inside:avoid;}
  table.data-table tr{page-break-inside:avoid;}
  table.data-table thead{display:table-header-group;}
  .nav-steps{display:none !important;}
  /* Credenciais só saem na folha do operador, nunca no relatório do cliente. */
  .operator-sheet{display:none;}
  body.print-operator .report-main{display:none;}
  body.print-operator .operator-sheet{display:block;}
  body.print-operator .cred-mask{display:none;}
  body.print-operator .cred-clear{display:inline;}
  body.print-operator h3.print-only{display:block;}
}
</style>
</head>

<div id="app"></div>
<script>
'use strict';
/* ======================================================================
   SUSE PoC Planner — single-file offline wizard
   ====================================================================== */

/* Requisitos de hardware do SUSE Virtualization, por nó: coluna "testes" (mínimo) e coluna "produção".
   Os números são os mesmos nas docs v1.7 e v1.8 (conferido) e no SUSE Virtualization PoC Guide v1.7.0 §7.1. */
const VIRT_SIZING = { min:{cpu:8, ram:32, disk:250}, prod:{cpu:16, ram:64, disk:500}, nic:{min:'1G', prod:'10G'}, nodes:3 };
/* Abaixo do mínimo de testes = gap; entre o mínimo e produção = "a confirmar"; em produção ou acima = ok. */
function virtSpecStatus(inf){
  const dims=[['cpuCores','cpu','CPU'],['ramGb','ram','RAM'],['diskGb','disk','disk']], z=VIRT_SIZING;
  const below=dims.filter(d=>Number(inf[d[0]])<z.min[d[1]]).map(d=>d[2]);
  const belowProd=dims.filter(d=>Number(inf[d[0]])>=z.min[d[1]] && Number(inf[d[0]])<z.prod[d[1]]).map(d=>d[2]);
  const nodesOk=Number(inf.nodeCount)>=z.nodes;
  return { status:(below.length||!nodesOk)?'gap':(belowProd.length?'confirm':'ok'), below:below, belowProd:belowProd, nodesOk:nodesOk };
}
/* A documentação acompanha a versão alvo quando ela foi conferida (1.7 e 1.8); fora disso usa a 1.7. */
function virtDocsVersion(){ const m=/^v?1\.(\d+)/.exec(String(state.virtInstall.targetVersion||'').trim()); return (m && (m[1]==='7'||m[1]==='8')) ? 'v1.'+m[1] : 'v1.7'; }
function docVirt(){ return 'https://documentation.suse.com/cloudnative/virtualization/'+virtDocsVersion()+'/en/'; }
/* Só a linha Prime é alvo; a comunitária (patch .0) não. Tabela conferida em 2026-10-23 em https://www.suse.com/lifecycle/#suse-virtualization:
   uma linha fora dela (ex.: 1.9.1) vira "a confirmar", nunca erro — atualize aqui quando sair um Prime novo. */
const VIRT_PRIME = { '1.8':{latest:2, eol:'29 Dec 2027'}, '1.7':{latest:3, eol:'9 Aug 2027'} };
function virtPrimeLatest(){ const k=Object.keys(VIRT_PRIME).sort((a,b)=>parseFloat(b.slice(2))-parseFloat(a.slice(2)))[0]; return 'v'+k+'.'+VIRT_PRIME[k].latest; }
function virtPrimeStatus(){
  const m=/^v?1\.(\d+)\.(\d+)$/.exec(String(state.virtInstall.targetVersion||'').trim()); if(!m) return null;
  const minor=m[1], patch=+m[2], lc=VIRT_PRIME['1.'+minor];
  if(patch===0) return {st:'gap', key:'community'};
  if(!lc) return {st:'confirm', key:'unlisted'};
  if(minor==='7') return {st:'confirm', key:'old', eol:lc.eol};
  return patch>=lc.latest ? {st:'ok', key:'ok', eol:lc.eol} : {st:'confirm', key:'patch', eol:lc.eol};
}
function virtVersionChecked(){ return /^v?1\.(7|8)(\.\d+)?$/.test(String(state.virtInstall.targetVersion||'').trim()); }

function eibProfiles(){ const sp=state.selectedProducts, o=[]; if(sp.rancher) o.push(1); if(sp.security||sp.storage||sp.registry) o.push(2); if(sp.observability) o.push(3); return o; }

function installWhen(key){
  const n=state.network, vn=state.virtNet, sp=state.selectedProducts;
  switch(key){
    case 'multinode': return state.infra.virtualization.nodeCount >= 2;
    case 'proxy': return !!n.hasProxy;
    case 'airgap': return !!n.hasAirGap;
    case 'connected': return !n.hasAirGap;
    case 'backup': return !!(vn.backup.type && vn.backup.type!=='none');
    case 'testvms': return state.virtInstall.testVms.length > 0;
    case 'dirauth': return !!sp.rancher && (vn.auth.provider==='ad' || vn.auth.provider==='ldap');
    case 'eib1': return eibProfiles().indexOf(1)>=0;
    case 'eib2': return eibProfiles().indexOf(2)>=0;
    case 'eib3': return eibProfiles().indexOf(3)>=0;
    case 'eibany': return eibProfiles().length>0;
    default: return true;
  }
}
function installApplies(s){
  const sp = state.selectedProducts;
  if(s.products && s.products.length){ const f=(x)=>!!sp[x]; if(!(s.all ? s.products.every(f) : s.products.some(f))) return false; }
  if(s.approach && s.approach.indexOf(state.installApproach)<0) return false;
  if(s.when && !installWhen(s.when)) return false;
  return true;
}
function installSteps(){
  return INSTALL_STEPS.filter(installApplies).sort((a,b)=>INSTALL_PHASE_ORDER.indexOf(a.phase)-INSTALL_PHASE_ORDER.indexOf(b.phase) || INSTALL_STEPS.indexOf(a)-INSTALL_STEPS.indexOf(b));
}

function urlHost(u){ const m=/^https?:\/\/(?:[^\/@]*@)?([^\/:?#]+)/i.exec(String(u||'').trim()); return m ? m[1].toLowerCase() : ''; }
function urlHasSecret(u){ return /^https?:\/\/[^\/]*@/i.test(String(u||'').trim()) || /[?&](token|key|secret|password|passwd|pass|sig|signature)=/i.test(String(u||'')); }
function urlShown(u,g){ u=String(u||'').trim(); if(!u) return '—'; return urlHasSecret(u) ? urlHost(u)+'/… ('+g('contém credencial — fica na folha do operador','contains a credential — kept on the operator sheet','contiene una credencial — queda en la hoja del operador')+')' : u; }

  list:(a,max)=>{ max=max||10; return a.length>max ? a.slice(0,max).join('\n')+'\n+'+(a.length-max) : a.join('\n'); }

function isPlainObject(v){ return !!v && typeof v==='object' && !Array.isArray(v); }
function deepMerge(def, src){
  if(!isPlainObject(src)) return def;
  const out = {...def};
  for(const k in def){
    if(src[k]===undefined) continue;
    /* Um default `{}` é um mapa de chaves desconhecidas de antemão (resultados de teste, portas
       marcadas, etapas concluídas): o salvo entra inteiro. Mesclar só as chaves do default o
       zerava a cada recarga. */
    if(isPlainObject(def[k]) && isPlainObject(src[k])) out[k] = Object.keys(def[k]).length ? deepMerge(def[k], src[k]) : src[k];
    else out[k] = src[k];
  }
  return out;
}
function normalizeLoadedState(raw){
  try{
    const parsed = JSON.parse(raw);
    const merged = deepMerge(defaultState(), parsed);
    if(merged.view==='cloudinit') merged.view='install';   // etapa removida
    /* Passos de instalação antigos (10) → ids novos; o que estava marcado continua marcado. */
    const LEG_INSTALL = {prep:['pf-hardware'],'install-virt':['virt-install-first','virt-install-join'],downstream:['downstream'],'install-rancher':['rancher-manual','rancher-online','eib1-boot'],

    Object.keys(LEG_INSTALL).forEach(k=>{
      if(merged.installProgress[k]) LEG_INSTALL[k].forEach(n=>{ if(merged.installProgress[n]===undefined) merged.installProgress[n]=true; });
      delete merged.installProgress[k];
    });
    if(INSTALL_APPROACHES.indexOf(merged.installApproach)<0) merged.installApproach='manual';
    /* O campo único "VLAN ID" virou a lista de redes de VM: projetos antigos levam o valor junto. */
    const oldVlan = parsed.network && String(parsed.network.vlanId||'').trim();
    if(oldVlan && !merged.virtNet.vmNetworks.length) merged.virtNet.vmNetworks = [{ name:'VLAN '+oldVlan, vlan:oldVlan, uplink:'' }];
    const legacyContact = parsed.project && (parsed.project.clientContactName || parsed.project.clientContactEmail || parsed.project.clientContactRole || parsed.project.clientContactPhone);
    if(legacyContact && (!Array.isArray(merged.project.contacts) || !merged.project.contacts.length || !merged.project.contacts[0].name)){
      merged.project.contacts = [{ name:parsed.project.clientContactName||'', role:parsed.project.clientContactRole||'', email:parsed.project.clientContactEmail||'', phone:parsed.project.clientContactPhone||'' }];
    }
    if(!Array.isArray(merged.project.contacts) || !merged.project.contacts.length){
      merged.project.contacts = [{name:'',role:'',email:'',phone:''}];
    }
    return merged;
  }catch(e){ return null; }
}

function loadProjectsIndex(){
  try{ return JSON.parse(localStorage.getItem(PROJECTS_INDEX_KEY)) || []; }catch(e){ return []; }
}
function saveProjectsIndex(idx){ localStorage.setItem(PROJECTS_INDEX_KEY, JSON.stringify(idx)); }
function projectLabel(st){ return (st && st.project && (st.project.projectName || st.project.clientOrganization)) || null; }

function migrateLegacyProjectIfNeeded(){
  const idx = loadProjectsIndex();
  if(idx.length) return idx;
  const legacyRaw = localStorage.getItem(STORAGE_KEY);
  if(!legacyRaw) return idx;
  const st = normalizeLoadedState(legacyRaw);
  if(!st) return idx;
  const id = uid();
  localStorage.setItem(projectKey(id), legacyRaw);
  localStorage.removeItem(STORAGE_KEY);
  const entry = { id, name: projectLabel(st) || 'Novo Projeto', updatedAt: Date.now() };
  saveProjectsIndex([entry]);
  localStorage.setItem(ACTIVE_PROJECT_KEY, id);
  return [entry];
}

let activeProjectId = null;
let lastSavedAt = null;

function initState(){
  let idx = migrateLegacyProjectIfNeeded();
  let id = localStorage.getItem(ACTIVE_PROJECT_KEY);
  if(!id || !idx.find(p=>p.id===id)) id = idx.length ? idx[0].id : null;
  if(!id){
    id = uid();
    const st = defaultState();
    localStorage.setItem(projectKey(id), JSON.stringify(st));
    saveProjectsIndex([{ id, name: 'Novo Projeto', updatedAt: Date.now() }]);
  }
  activeProjectId = id;
  localStorage.setItem(ACTIVE_PROJECT_KEY, id);
  const raw = localStorage.getItem(projectKey(id));
  return (raw && normalizeLoadedState(raw)) || defaultState();
}

let state = initState();
lastSavedAt = Date.now();
function saveState(){
  localStorage.setItem(projectKey(activeProjectId), JSON.stringify(state));
  const idx = loadProjectsIndex();
  const label = projectLabel(state) || tr('common.newProject');
  const entry = idx.find(p=>p.id===activeProjectId);
  if(entry){ entry.name = label; entry.updatedAt = Date.now(); }
  else idx.push({ id: activeProjectId, name: label, updatedAt: Date.now() });
  saveProjectsIndex(idx);
  lastSavedAt = Date.now();
}
function switchToProject(id){
  const raw = localStorage.getItem(projectKey(id));
  if(!raw) return;
  activeProjectId = id;
  localStorage.setItem(ACTIVE_PROJECT_KEY, id);
  state = normalizeLoadedState(raw) || defaultState();
  state.view = 'dashboard';
}
function createNewProject(){
  const id = uid();
  activeProjectId = id;
  localStorage.setItem(ACTIVE_PROJECT_KEY, id);
  state = defaultState();
  saveState();
}
function deleteProjectById(id){
  localStorage.removeItem(projectKey(id));
  const idx = loadProjectsIndex().filter(p=>p.id!==id);
  saveProjectsIndex(idx);
  if(id === activeProjectId){
    if(idx.length){ switchToProject(idx[0].id); }
    else { createNewProject(); }
  }
}

function setPath(obj, path, value){
  const keys = path.split('.');
  let cur = obj;
  for(let i=0;i<keys.length-1;i++){ cur = cur[keys[i]]; }
  cur[keys[keys.length-1]] = value;
}
function getPath(obj, path){
  return path.split('.').reduce((o,k)=> (o&&o[k]!==undefined)?o[k]:undefined, obj);
}

function stepMissingCount(step){
  const s = state; const sel = s.selectedProducts;
  const countEmpty = (vals) => vals.filter(v => !v || !String(v).trim()).length;
  switch(step){
    case 'project':
      return countEmpty([s.project.projectName, s.project.leadEngineer, s.project.leadEmail, s.project.clientOrganization]);
    case 'network':
      return countEmpty([s.network.managementCidr, s.network.gatewayIp, s.network.clusterVip, s.network.ipPoolStart, s.network.ipPoolEnd])
        + (sel.virtualization ? countEmpty([s.virtNet.mgmtNics, s.virtNet.vmNics, s.virtNet.nicSpeed, s.virtNet.ipMode, s.virtNet.backup.type]) : 0);
    case 'credentials': {
      const req = [];
      if(sel.rancher) req.push(s.credentials.rancherBootstrapPassword, s.credentials.appCollectionUser, s.credentials.appCollectionToken);
      if(sel.security||sel.storage||sel.registry||sel.observability) req.push(s.credentials.sccUser, s.credentials.sccPassword);
      if(sel.observability) req.push(s.credentials.observabilityPassword, s.credentials.stackstateLicense);
      if(sel.registry) req.push(s.credentials.privateRegistryAdminPassword);
      if(sel.security) req.push(s.credentials.neuvectorAdminPassword);
      if(sel.manager) req.push(s.credentials.managerActivationKey);
      if(sel.virtualization) req.push(s.credentials.virtualizationClusterToken);
      if(sel.rancher && (s.virtNet.auth.provider==='ad'||s.virtNet.auth.provider==='ldap')) req.push(s.credentials.directoryBindPassword);
      return countEmpty(req);
    }
    default: return 0;
  }
}
function renderWizardNav(){
  const currentIdx = WIZARD_STEPS.indexOf(state.view);
  return '<div class="nav-steps no-print">' + WIZARD_STEPS.map((step,idx)=>{
    const isActive = step===state.view;
    const isDone = idx < currentIdx;
    const missing = stepMissingCount(step);
    const badge = (missing>0 && !isDone) ? ('<span class="nav-badge" title="'+missing+' '+tr('common.missingBadge')+'" style="position:absolute;top:-4px;right:-4px;background:var(--red-600,#dc2626);color:#fff;border-radius:99px;min-width:16px;height:16px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px;">'+missing+'</span>') : '';
    return (idx>0 ? '<div class="nav-line '+(isDone?'done':'')+'"></div>' : '')
      + '<button class="nav-step '+(isActive?'active':'')+' '+(isDone?'done':'')+'" onclick="P.go(\''+step+'\')">'
      + '<div class="nav-circle" style="position:relative;">' + (isDone ? Icon('check') : Icon(STEP_ICON[step])) + badge + '</div>'
      + '<span class="nav-label">' + tr('nav.'+step) + '</span>'
      + '</button>';
  }).join('') + '</div>';
}

/* ---------------- helpers ---------------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function field(label, path, opts){
  opts = opts||{};
  const val = getPath(state, path);
  const type = opts.type || 'text';
  if(type==='select'){
    return '<div><label class="field-label">'+label+'</label><select onchange="P.setField'+(opts.liveRender?'AndRender':'')+'(\''+path+'\', this.value)">'
      + (opts.options||[]).map(o=>'<option value="'+o.value+'" '+(val===o.value?'selected':'')+'>'+o.label+'</option>').join('')
      + '</select></div>';
  }
  if(type==='checkbox'){
    return '<label class="flex items-center gap-2" style="cursor:pointer;font-size:12.5px;font-weight:700;"><input type="checkbox" '+(val?'checked':'')+' onchange="P.setFieldAndRender(\''+path+'\', this.checked)" style="width:16px;height:16px;accent-color:var(--suse-base);">'+label+'</label>';
  }
  if(type==='textarea'){
    return '<div><label class="field-label">'+label+'</label><textarea rows="'+(opts.rows||3)+'" oninput="P.setField(\''+path+'\', this.value)">'+esc(val)+'</textarea></div>';
  }
  const valueExpr = 'this.'+(type==='number'?'valueAsNumber || 0':'value');
  const attrs = 'type="'+type+'" value="'+esc(val)+'" placeholder="'+(opts.placeholder||'')+'" '+(opts.min!=null?'min="'+opts.min+'"':'');
  return opts.liveRender
    ? '<div><label class="field-label">'+label+'</label><input '+attrs+' oninput="P.setField(\''+path+'\', '+valueExpr+')" onchange="render()"></div>'
    : '<div><label class="field-label">'+label+'</label><input '+attrs+' oninput="P.setField(\''+path+'\', '+valueExpr+')"></div>';
}

/* ---------------- NETWORK / IP POOL ---------------- */
function ipToInt(ip){ const p=(ip||'0.0.0.0').split('.').map(n=>parseInt(n,10)||0); return ((p[0]<<24)>>>0)+(p[1]<<16)+(p[2]<<8)+p[3]; }
function intToIp(n){ return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.'); }
function rebuildVms(){
  const sp = state.selectedProducts;
  const desired = [];
  if(sp.virtualization){ for(let i=0;i<state.infra.virtualization.nodeCount;i++) desired.push({key:'virtualization-'+i,product:'virtualization',role:i<3?'Management/HCI':'Worker HCI',defaultUser:'rancher'}); }
  if(sp.rancher){ desired.push({key:'rancher-vm',product:'rancher',role:'Rancher Server',defaultUser:'opensuse'}); }
  if(sp.observability){ desired.push({key:'observability-vm',product:'observability',role:'Observability',defaultUser:'opensuse'}); }
  if(sp.manager){ for(let i=0;i<state.infra.manager.nodeCount;i++) desired.push({key:'manager-'+i,product:'manager',role:'Multi-Linux Manager Server',defaultUser:'root'}); }
  { const addonIds=['security','storage','registry','appcollection'].filter(id=>sp[id]); if(addonIds.length){ desired.push({key:'addons-vm',product:'addons',role:'Downstream cluster ('+addonIds.join(', ')+')',defaultUser:'opensuse'}); } }

  const existingByKey = {}; (state.network.vms||[]).forEach(v=>existingByKey[v.key]=v);
  const usedIps = new Set(Object.values(existingByKey).map(v=>v.ip).filter(Boolean));
  let ip = ipToInt(state.network.ipPoolStart || '192.168.1.20');
  const endIp = ipToInt(state.network.ipPoolEnd || '192.168.1.60');
  let counter = {};
  const newList = desired.map(d=>{
    if(existingByKey[d.key]){ existingByKey[d.key].role = d.role; return existingByKey[d.key]; }   // o papel é derivado, não editável
    counter[d.product] = (counter[d.product]||0)+1;
    while(ip<=endIp && usedIps.has(intToIp(ip))) ip++;
    const assigned = ip<=endIp ? intToIp(ip) : '';
    if(assigned){ usedIps.add(assigned); ip++; }
    return {key:d.key, product:d.product, role:d.role, hostname:(d.product==='addons'?'downstream':d.product)+'-'+counter[d.product], ip:assigned, user:d.defaultUser, password:''};
  });
  state.network.vms = newList;
  saveState();
}
/* ---------------- EIB-SUSE-PoC EXPORT ----------------
   Gera um JSON "achatado" por perfil (1=Rancher, 2=Essencial, 3=Observability)
   que o run.sh do projeto EIB-SUSE-PoC consegue ler de base-images/ e usar
   pra pré-preencher o formulário (hostname, IP, gateway, licenças etc).
   Virtualization e Multi-Linux Manager não fazem parte do EIB — ignorados. */
function normClient(s){
  return (s||'cliente').toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
}
function eibCommonFields(){
  const n = state.network, proj = state.project;
  const prefix = (n.managementCidr||'').split('/')[1] || '24';
  const dns1 = (n.dnsServers||'').split(',')[0].trim();
  let pocDays = '0';
  if(proj.startDate && proj.targetDate){
    const diff = Math.round((new Date(proj.targetDate) - new Date(proj.startDate)) / 86400000);
    if(diff > 0) pocDays = String(diff);
  }
  return {
    GATEWAY: n.gatewayIp||'', PREFIX: prefix, DNS1: dns1,
    SSH_KEY: '',   // run.sh pergunta; o planner não coleta chave SSH
    CLIENT_NAME: normClient(proj.clientOrganization || proj.projectName),
    POC_DAYS: pocDays,
    SCC_REG_CODE: state.credentials.suseRegistrationCode || ''
  };
}
function eibVmFields(product){
  const vm = state.network.vms.find(v=>v.product===product);
  if(!vm || !vm.ip) return null;
  const domain = state.network.domain || 'poc.local';
  return { NODE_HOSTNAME: vm.hostname, NODE_FQDN: vm.hostname+'.'+domain, STATIC_IP: vm.ip, ROOT_PASS: vm.password||'' };
}
function buildEibProfileJson(profile){
  const common = eibCommonFields();
  const cred = state.credentials;
  if(profile===1){
    const vm = eibVmFields('rancher'); if(!vm) return null;
    return Object.assign({profile:1}, common, vm, {
      RANCHER_FQDN: 'rancher.'+vm.NODE_FQDN,
      RANCHER_BOOTSTRAP_PASS: cred.rancherBootstrapPassword||'',
      AC_USER: cred.appCollectionUser||'', AC_TOKEN: cred.appCollectionToken||''
    });
  }
  if(profile===2){
    const vm = eibVmFields('addons'); if(!vm) return null;
    return Object.assign({profile:2}, common, vm, { SCC_USER: cred.sccUser||'', SCC_PASS: cred.sccPassword||'' });
  }
  if(profile===3){
    const vm = eibVmFields('observability'); if(!vm) return null;
    return Object.assign({profile:3}, common, vm, {
      SCC_USER: cred.sccUser||'', SCC_PASS: cred.sccPassword||'',
      STACKSTATE_LICENSE: cred.stackstateLicense||'', STACKSTATE_ADMIN_PASS: cred.observabilityPassword||''
    });
  }
  return null;
}
function eibApplicableProfiles(){
  const sp = state.selectedProducts;
  const profiles = [];
  if(sp.rancher) profiles.push(1);
  if(sp.security || sp.storage || sp.registry) profiles.push(2);
  if(sp.observability) profiles.push(3);
  return profiles;
}
/* Um único arquivo pro run.sh ler: cada campo vira "p<N>_CAMPO" (ex: p1_NODE_HOSTNAME),
   em vez de um JSON por perfil com um campo "profile". Mantém o parser do run.sh simples
   (grep/sed num objeto plano, sem aninhamento) e evita múltiplos downloads. */
function buildEibCombinedJson(){
  const combined = {};
  eibApplicableProfiles().forEach(p=>{
    const data = buildEibProfileJson(p);
    if(!data) return;
    Object.keys(data).forEach(k=>{
      if(k==='profile') return;
      combined['p'+p+'_'+k] = data[k];
    });
  });
  return combined;
}

  }
}

function buildArchitectureDiagram(L){
  const g=(pt,en,es)=>({pt,en,es})[L] || en;
  const m = archModel(L), W = 900, P = 10, e = esc;
  const rect=(x,y,w,h,c,o)=>{ o=o||{}; return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(o.rx||8)+'" fill="'+(o.fill||c)+'" fill-opacity="'+(o.fo==null?.1:o.fo)+'" stroke="'+c+'" stroke-width="'+(o.sw||1.5)+'"'+(o.dash?' stroke-dasharray="5 4"':'')+'/>'; };
  const text=(x,y,t,cls,anchor)=>'<text x="'+x+'" y="'+y+'" class="'+cls+'"'+(anchor?' text-anchor="'+anchor+'"':'')+'>'+e(t)+'</text>';
  const line=(x1,y1,x2,y2,c)=>'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#94a3b8')+'" stroke-width="1.5"/>';
  let y = 8, body = '';

  // 1) externos
  const k = m.external.length, gap = 10, bw = (W-2*P-(k-1)*gap)/k, eh = 54, chars = Math.floor((bw-14)/6.8);
  m.external.forEach((x,i)=>{ const bx = P+i*(bw+gap);
    body += rect(bx,y,bw,eh,x.color,{dash:true}) + text(bx+bw/2,y+22,archFit(x.title,Math.floor((bw-14)/8.8)),'a-t','middle') + text(bx+bw/2,y+41,archFit(x.sub,chars),'a-s','middle'); });
  const extBottom = y+eh; y += eh + 20;
  // 2) switch
  const swY = y, swH = 48;
  m.external.forEach((x,i)=>{ const cx = P+i*(bw+gap)+bw/2; body += line(cx,extBottom,cx,swY,'#94a3b8'); });
  body += rect(P,swY,W-2*P,swH,m.sw.ok?'#0f766e':'#b45309',{fo:.1}) + text(W/2,swY+21,m.sw.title,'a-t','middle') + text(W/2,swY+39,archFit(m.sw.sub,118),'a-s','middle');
  y = swY + swH + 10;
  // 3) redes
  const laneTop = y;
  m.lanes.forEach(l=>{ body += rect(P,y,W-2*P,28,l.color,{rx:6,fo:.14,dash:l.dashed,sw:1.2}) + text(P+10,y+19,l.name,'a-t') + text(P+135,y+19,archFit(l.detail,Math.floor((W-2*P-145)/6.8)),'a-s'); y += 33; });
  const laneBottom = y - 5; y += 14;
  // 4) cluster / hosts / storage / cargas
  const frameY = y; let inner = y + 34;
  let hostsBlock = '', hostCenters = [];
  if(m.hosts){
    const per = 5, total = m.hosts.shown + (m.hosts.more>0?1:0), rows = Math.ceil(total/per), hw = (W-2*P-24-(per-1)*8)/per, hh = 76;
    for(let i=0;i<total;i++){
      const r = Math.floor(i/per), c = i%per, hx = P+12+c*(hw+8), hy = inner + r*(hh+8), isMore = i===m.hosts.shown && m.hosts.more>0;
      if(isMore){ hostsBlock += rect(hx,hy,hw,hh,'#64748b',{dash:true}) + text(hx+hw/2,hy+hh/2+5,'+'+m.hosts.more+' '+g('hosts','hosts','hosts'),'a-t','middle'); }
      else { const mg = i<3 && m.hosts.count>=3;
        hostsBlock += rect(hx,hy,hw,hh,'#30ba78',{fo:.12}) + text(hx+8,hy+19,'Host '+(i+1),'a-t') + text(hx+8,hy+36,mg?'mgmt / HCI':(m.hosts.count>=3?'worker HCI':'HCI'),'a-s') + text(hx+8,hy+53,archFit(m.hosts.spec,Math.floor((hw-12)/6.3)),'a-s') + text(hx+8,hy+70,archFit(m.hosts.nic||'',Math.floor((hw-12)/6.8)),'a-s'); }
      if(r===0) hostCenters.push(hx+hw/2);
    }
    inner += rows*(hh+8);
    hostCenters.forEach(cx=>{ hostsBlock += line(cx,laneBottom,cx,inner-rows*(hh+8)) ; });
    hostsBlock += '';
    // storage band
    hostsBlock += rect(P+12,inner,W-2*P-24,30,'#9333ea',{rx:6,fo:.12}) + text(P+22,inner+20,archFit(m.storage.title,52),'a-t') + text(W-P-22,inner+20,archFit(m.storage.sub,40),'a-s','end');
    inner += 30 + 12;
  } else {
    hostsBlock += rect(P+12,inner,W-2*P-24,44,'#64748b',{fo:.1}) + text(W/2,inner+27,m.baseLabel,'a-t','middle'); hostCenters=[W/2];
    hostsBlock += line(W/2,laneBottom,W/2,inner); inner += 44 + 12;
  }
  // cargas
  let guestsBlock = '';
  if(m.guests.length){
    const gc = Math.min(4, m.guests.length), rows = Math.ceil(m.guests.length/gc), gw = (W-2*P-24-(gc-1)*8)/gc, gh = 68;
    guestsBlock += text(P+12,inner+12,g('Cargas em execução no cluster','Workloads running on the cluster','Cargas en ejecución en el clúster'),'a-s'); inner += 20;
    m.guests.forEach((x,i)=>{ const r=Math.floor(i/gc), c=i%gc, gx=P+12+c*(gw+8), gy=inner+r*(gh+8), ch=Math.floor((gw-14)/6.8);
      guestsBlock += rect(gx,gy,gw,gh,x.color,{fo:.12}) + text(gx+8,gy+20,archFit(x.title,Math.floor((gw-14)/8.8)),'a-t') + text(gx+8,gy+39,archFit(x.line1,ch),'a-s') + text(gx+8,gy+57,archFit(x.line2,ch),'a-s'); });
    inner += rows*(gh+8);
  }
  const frameH = inner - frameY + 4;
  body += rect(P,frameY,W-2*P,frameH,'#30ba78',{rx:12,fo:.03,sw:2}) + text(P+14,frameY+21,archFit(m.cluster ? m.cluster.title+' · '+m.cluster.sub : m.baseLabel,92),'a-t')
        + hostsBlock + guestsBlock;
  y = frameY + frameH + 20;
  body += text(P,y,g('Tracejado = fora da infraestrutura do cluster · cores nas faixas = redes','Dashed = outside the cluster infrastructure · lane colours = networks','Punteado = fuera de la infraestructura del clúster · colores de las franjas = redes'),'a-s');
  y += 8;
  return '<svg class="arch-svg" viewBox="0 0 '+W+' '+y+'" width="100%" role="img" aria-label="'+e(g('Arquitetura integrada','Integrated architecture','Arquitectura integrada'))+'" xmlns="http://www.w3.org/2000/svg">' + body + '</svg>';
}

/* ---------------- TEST PLAN ---------------- */
function ensureTestCases(){
  const sp = state.selectedProducts;
  let changed = false;
  PRODUCTS.forEach(p=>{
    if(!sp[p.id]) return;
    const items = TEST_CATALOG.filter(it=>it.product===p.id);
    if(!items.length) return;
    const list = state.testCases[p.id] || (state.testCases[p.id] = []);
    /* Migração dos testes de texto livre de versões antigas: sem resultado → o catálogo traz o
       equivalente; com resultado → mantém e vincula ao item do catálogo, sem duplicar. */
    LEGACY_TESTS.filter(lg=>lg.product===p.id).forEach(lg=>{
      for(let i=list.length-1;i>=0;i--){
        const t=list[i];
        if(t.catalogId || lg.texts.indexOf(t.text)<0) continue;
        if(t.result==='pending') list.splice(i,1); else { t.catalogId=lg.id; delete t.text; }
        changed = true;
      }
    });
    list.forEach(t=>{ const it=testItem(t); if(it && it.unverified && t.fit===undefined){ t.fit='validate'; changed=true; } });   // projetos salvos antes do campo "aderência"
    items.forEach(it=>{
      if(!testApplies(it) || list.some(t=>t.catalogId===it.id) || state.testDismissed.indexOf(it.id)>=0) return;
      list.push({ id:uid(), catalogId:it.id, result:'pending', priority:it.tier, fit:it.unverified?'validate':'', led:'', owner:'', evidence:'', notes:'' });
      changed = true;
    });
  });
  if(changed) saveState();
}

  if(!active.length) return '<div class="card"><div class="alert alert-info">'+Icon('info')+' '+g('Selecione produtos na etapa anterior.','Select products in a previous step.','Seleccione productos en la etapa anterior.')+'</div></div>';
  const st = testStats(sp), filtersOn = testFiltersActive();
  const cov = (b) => b.pass+'/'+b.total;
  const chip = (cls, key, label, n) => '<button class="pill '+cls+'" style="border:none;cursor:pointer;" title="'+g('Filtrar por este status','Filter by this status','Filtrar por este estado')+'" onclick="P.setTestFilterAndRender(\'status\',\''+(testFilters.status===key?'':key)+'\')">'+label+' · '+n+'</button>';
  let total = 0, shown = 0;
  const cards = active.map(p=>{
    const all = orderedTests(p.id), list = all.filter(x=>testMatchesFilter(x.t));
    total += all.length; shown += list.length;
    if(filtersOn && !list.length) return '';   // com filtro, não mostra produto sem resultado
    const done = all.filter(x=>!testIsOpen(x.t)).length;
    let body = '', lastGroup = '';
    list.forEach(x=>{
      const it = testItem(x.t), grp = it ? it.group : '';
      if(testHasGroups(p.id) && grp !== lastGroup){ lastGroup = grp; if(grp) body += '<div class="text-xs mt-3" style="font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);">'+(TEST_GROUPS[grp][L]||TEST_GROUPS[grp].en)+'</div>'; }
      body += testRow(p, x, L, g);
    });
    return '<div class="card">'
      + '<div class="flex justify-between items-center"><h3 style="font-weight:900;font-size:14px;display:flex;align-items:center;gap:8px;margin:0 0 10px;"><span class="badge-dot" style="background:'+p.color+'"></span>'+p.name+'</h3>'
      + '<span class="text-xs text-muted">'+(filtersOn ? list.length+' '+g('de','of','de')+' '+all.length+' '+g('exibidos','shown','mostrados') : done+' '+g('de','of','de')+' '+all.length+' '+g('concluídos','completed','completados'))+'</span></div>'
      + (body || '<p class="text-xs text-muted mt-2">' + g('Nenhum teste ainda.','No tests yet.','Ninguna prueba todavía.') + '</p>')
      + '<button class="btn btn-outline btn-sm mt-3" onclick="P.addTest(\''+p.id+'\')">' + Icon('plus') + ' ' + g('Adicionar teste específico','Add specific test','Agregar prueba específica') + '</button>'
    + '</div>';
  }).join('');
  const head = '<div class="card"><div class="flex gap-2 flex-wrap items-center">'
    + '<span class="pill pill-warn">must-have ' + cov(st.must) + '</span><span class="pill pill-off">nice-to-have ' + cov(st.nice) + '</span>'
    + chip('pill-bad','fail',g('não atende','does not meet','no cumple'),st.must.fail+st.nice.fail) + chip('pill-warn','partial',g('parcial','partial','parcial'),st.must.partial+st.nice.partial) + chip('pill-off','pending',g('pendentes','pending','pendientes'),st.must.pending+st.nice.pending)
    + (st.na ? '<span class="pill pill-off">N/A · ' + st.na + '</span>' : '')
    + '</div><p class="text-xs text-muted mt-2">' + testSourcesText(sp, g) + '</p></div>';
  return head + renderTestFilters(g, L, shown, total)
    + (cards || '<div class="card"><div class="alert alert-info">'+Icon('info')+' '+g('Nenhum teste corresponde aos filtros.','No tests match the filters.','Ninguna prueba coincide con los filtros.')+'</div></div>');

/* O Chrome ignora "não quebrar depois" em linhas de tabela. Então a linha de grupo (fase, grupo de testes)
   vai num <tbody> junto com a linha seguinte, e esse bloco não se parte: o título nunca fica sozinho. */
function keepHeads(rowsHtml){
  const trs = rowsHtml.match(/<tr>[\s\S]*?<\/tr>(?=<tr>|$)/g) || [];
  let out = '', run = ''; const flush = ()=>{ if(run){ out += '<tbody>'+run+'</tbody>'; run = ''; } };
  for(let i=0;i<trs.length;i++){
    if(/grp-row/.test(trs[i].slice(0,160))){ flush(); out += '<tbody class="keep-head">'+trs[i]+(trs[i+1]||'')+'</tbody>'; i++; }
    else run += trs[i];
  }
  flush(); return out;
}
function summaryCard(icon, title, bodyHtml){
  const short = (bodyHtml.match(/<tr/g)||[]).length <= 14 && bodyHtml.length < 9000;   // cabe numa página: não parte o cartão
  return '<div class="card'+(short?' keep-together':'')+'">'
    + '<h3 style="font-weight:900;font-size:15px;display:flex;align-items:center;gap:8px;margin:0 0 14px;color:var(--ink);">' + Icon(icon) + ' ' + title + '</h3>'

}

/* --- helpers de rede --- */
function isIPv4(s){ s=(s||'').trim(); return /^\d{1,3}(\.\d{1,3}){3}$/.test(s) && s.split('.').every(o=>+o<=255); }
function cidrParse(c){
  const m=/^(\d{1,3}(?:\.\d{1,3}){3})\/(\d{1,2})$/.exec((c||'').trim());
  if(!m || !isIPv4(m[1]) || +m[2]>32) return null;
  const mask = +m[2]===0 ? 0 : (0xFFFFFFFF << (32-(+m[2]))) >>> 0;
  return { base:(ipToInt(m[1]) & mask)>>>0, mask };
}
function inCidr(ip, cidr){ const p=cidrParse(cidr); return !!p && isIPv4(ip) && ((ipToInt(ip.trim()) & p.mask)>>>0)===p.base; }
function addDaysISO(iso, days){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); if(!m) return '';
  return new Date(Date.UTC(+m[1], +m[2]-1, +m[3]+days)).toISOString().split('T')[0];
}

/* Riscos e pendências: derivados do que já foi coletado, sem entrada nova. */
function summaryRisksSection(L,g,sp,readiness){
  const rows=[];
  readiness.filter(i=>i.status==='gap').forEach(i=>rows.push({sev:'high', src:i.area, text:i.label}));
  readiness.filter(i=>i.status==='confirm').forEach(i=>rows.push({sev:'med', src:i.area, text:i.label}));
  let pendPorts=0; PRODUCTS.filter(p=>sp[p.id]&&PORT_REQUIREMENTS[p.id]).forEach(p=>PORT_REQUIREMENTS[p.id].forEach((r,i)=>{ if(!state.ports.checked[p.id+'-'+i]) pendPorts++; }));
  pendPorts += hostsProgress().t - hostsProgress().d;
  if(pendPorts) rows.push({sev:'med', src:g('Portas','Ports','Puertos'), text:pendPorts+' '+g('regra(s) de firewall ainda não liberada(s)','firewall rule(s) not yet opened','regla(s) de firewall aún no habilitada(s)')});
  const pendSteps = installSteps().filter(s=>!state.installProgress[s.id]).length;
  if(pendSteps) rows.push({sev:'low', src:g('Instalação','Install','Instalación'), text:pendSteps+' '+g('etapa(s) do runbook não concluída(s)','runbook step(s) not completed','etapa(s) del runbook no concluida(s)')});
  const ts = testStats(sp), T = g('Testes','Tests','Pruebas');
  if(ts.must.fail) rows.push({sev:'high', src:T, text:ts.must.fail+' '+g('teste(s) must-have reprovado(s)','must-have test(s) failed','prueba(s) must-have fallida(s)')});
  if(ts.nice.fail) rows.push({sev:'med', src:T, text:ts.nice.fail+' '+g('teste(s) nice-to-have reprovado(s)','nice-to-have test(s) failed','prueba(s) nice-to-have fallida(s)')});
  if(ts.must.partial) rows.push({sev:'med', src:T, text:ts.must.partial+' '+g('teste(s) must-have parcial(is)','must-have test(s) partial','prueba(s) must-have parcial(es)')});
  if(ts.nice.partial) rows.push({sev:'low', src:T, text:ts.nice.partial+' '+g('teste(s) nice-to-have parcial(is)','nice-to-have test(s) partial','prueba(s) nice-to-have parcial(es)')});
  if(ts.must.pending) rows.push({sev:'med', src:T, text:ts.must.pending+' '+g('teste(s) must-have ainda pendente(s)','must-have test(s) still pending','prueba(s) must-have aún pendiente(s)')});
  if(ts.nice.pending) rows.push({sev:'low', src:T, text:ts.nice.pending+' '+g('teste(s) nice-to-have ainda pendente(s)','nice-to-have test(s) still pending','prueba(s) nice-to-have aún pendiente(s)')});
  if(!rows.length) return '<div class="alert alert-ok">'+Icon('check')+' '+g('Nenhuma pendência identificada.','No open items identified.','Ningún punto pendiente identificado.')+'</div>';
  const sev={high:['pill-bad',g('Alto','High','Alto')], med:['pill-warn',g('Médio','Medium','Medio')], low:['pill-off',g('Baixo','Low','Bajo')]};
  const order={high:0,med:1,low:2};
  rows.sort((a,b)=>order[a.sev]-order[b.sev]);
  return '<table class="data-table"><thead><tr><th>'+g('Severidade','Severity','Severidad')+'</th><th>'+g('Origem','Source','Origen')+'</th><th>'+g('Pendência / risco','Open item / risk','Punto pendiente / riesgo')+'</th></tr></thead><tbody>'
    + rows.map(r=>'<tr><td><span class="pill '+sev[r.sev][0]+'">'+sev[r.sev][1]+'</span></td><td class="text-xs">'+r.src+'</td><td class="text-xs">'+r.text+'</td></tr>').join('') + '</tbody></table>';
}

    + '</div>'
    + '<h1 style="font-size:26px;font-weight:900;color:var(--ink);margin:0 0 4px;">' + esc(proj.projectName||g('(sem nome)','(untitled)','(sin nombre)')) + '</h1>'
    + '<p class="text-sm text-muted">' + esc(proj.organization||'') + (proj.organization && proj.clientOrganization ? ' → ' : '') + esc(proj.clientOrganization||'') + '</p>'
    + '<div class="grid grid-4 mt-3">'
      + summaryField(g('Engenheiro Responsável','Lead Engineer','Ingeniero Responsable'), proj.leadEngineer)
      + summaryField('E-mail', proj.leadEmail)
      + summaryField(g('Início','Start','Inicio'), proj.startDate)
      + summaryField(g('Data Alvo','Target Date','Fecha Objetivo'), proj.targetDate)
    + '</div>'
    + (contacts.length ? ('<div class="text-xs text-muted mt-3" style="font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:10px;">' + g('Contatos do Cliente','Client Contacts','Contactos del Cliente') + '</div>'
      + contacts.map(c=>'<div class="grid grid-4 mt-1" style="padding:6px 0;border-bottom:1px solid var(--gray-100);">'
        + summaryField(g('Nome','Name','Nombre'), c.name) + summaryField(g('Função','Role','Función'), c.role) + summaryField('E-mail', c.email) + summaryField(g('Telefone','Phone','Teléfono'), c.phone)
      + '</div>').join('')) : '')
  + '</div>';

  html += S('doc', g('Sumário executivo e escopo','Executive summary and scope','Resumen ejecutivo y alcance'),
    '<p class="text-sm">' + g('Este documento descreve o plano da Prova de Conceito','This document describes the Proof of Concept plan','Este documento describe el plan de la Prueba de Concepto') + ' <b>' + esc(proj.projectName||'—') + '</b>'
      + (proj.clientOrganization ? ' ' + g('para','for','para') + ' <b>' + esc(proj.clientOrganization) + '</b>' : '') + '. '
      + g('Escopo limitado aos produtos:','Scope limited to the products:','Alcance limitado a los productos:') + '</p>'
    + '<div class="flex flex-wrap gap-2 mt-2">' + selected.map(p=>'<span class="pill" style="background:'+p.color+';color:#fff;">'+p.name+'</span>').join('') + '</div>'
    + '<div class="grid grid-3 mt-3">'
      + summaryField(g('Caso de uso (pré-vendas)','Presales Use Case','Caso de uso (preventa)'), proj.presalesUseCase) + summaryField(g('Problema de negócio','Business Issue','Problema de negocio'), proj.businessIssue)
      + summaryField(g('Infraestrutura Alvo','Target Infrastructure','Infraestructura Objetivo'), proj.targetInfrastructure)
    + '</div>'
    + '<div class="mt-3"><div class="text-xs text-muted" style="font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:10px;">' + g('Objetivos da PoC','PoC Goals','Objetivos de la PoC') + '</div>'
      + ((proj.goals&&proj.goals.length) ? '<ul class="mt-1">' + proj.goals.map(gl=>'<li class="text-sm">'+esc(gl)+'</li>').join('') + '</ul>' : '<p class="text-xs text-muted">—</p>') + '</div>');

  html += S('activity', g('Cronograma','Schedule','Cronograma'), summaryTimelineSection(g));
  html += S('box', g('Versões de software','Software versions','Versiones de software'), summaryVersionsSection(g, sp));
  html += S('checksq', g('Prontidão e requisitos (guia v1.7.0)','Readiness and requirements (guide v1.7.0)','Preparación y requisitos (guía v1.7.0)'), summaryReadinessSection(g, readiness));
  html += S('server', g('Dimensionamento da infraestrutura','Infrastructure sizing','Dimensionamiento de la infraestructura'), summaryInfraSection(L,g,sp));
  html += S('network', g('Rede e endereçamento','Network and addressing','Red y direccionamiento'), summaryNetworkSection(L,g));
  if(sp.virtualization) html += S('settings', g('Design do SUSE Virtualization','SUSE Virtualization design','Diseño de SUSE Virtualization'), summaryVirtDesignSection(L,g));
  html += S('eye', g('Arquitetura integrada','Integrated architecture','Arquitectura integrada'), buildArchitectureDiagram(L)).replace('<div class="card">','<div class="card keep-together">');
  html += S('shield', g('Portas e firewall','Ports and firewall','Puertos y firewall'), summaryPortsSection(L,g,sp));
  html += S('terminal', g('Checklist de instalação','Installation checklist','Checklist de instalación'), summaryRunbookSection(L,g,sp));
  html += S('activity', g('Plano de testes e resultados','Test plan and results','Plan de pruebas y resultados'), summaryTestsSection(L,g,sp));
  html += S('alert', g('Riscos e pendências','Risks and open items','Riesgos y puntos pendientes'), summaryRisksSection(L,g,sp,readiness));
  html += S('doc', g('Autorização / aceite','Authorization / sign-off','Autorización / aceptación'), summarySignoffSection(g));
  html += '</div>';

  html += '<div class="card operator-sheet">'
    + '<div class="flex justify-between items-center no-print mb-3">'
      + '<h3 style="font-weight:900;font-size:15px;display:flex;align-items:center;gap:8px;margin:0;color:var(--ink);">' + Icon('key') + ' ' + g('Folha do operador — credenciais (não vai no relatório do cliente)','Operator sheet — credentials (not part of the client report)','Hoja del operador — credenciales (no va en el informe del cliente)') + '</h3>'
      + '<button class="btn btn-outline btn-sm" onclick="P.printOperatorSheet()">' + Icon('print') + ' ' + g('Imprimir folha do operador','Print operator sheet','Imprimir hoja del operador') + '</button>'
    + '</div>'
    + '<div class="alert alert-warn no-print mb-3">' + Icon('lock') + ' ' + g('Valores sensíveis aparecem mascarados aqui e só em texto claro na impressão desta folha. Guarde-a com cuidado.','Sensitive values are masked here and only appear in clear text when printing this sheet. Store it carefully.','Los valores sensibles aparecen enmascarados aquí y solo en texto claro al imprimir esta hoja. Guárdela con cuidado.') + '</div>'
    + '<h3 class="print-only" style="margin:0 0 10px;">' + esc(proj.projectName||'') + ' — ' + g('Folha do operador','Operator sheet','Hoja del operador') + '</h3>'
    + summaryCredentialsSection(L,g,sp)
    + (state.credentials.notes ? '<div class="mt-3">'+summaryField(g('Notas','Notes','Notas'), state.credentials.notes)+'</div>' : '')
  + '</div>';

  return html;
}

/* ===================== GLOBAL NAMESPACE (event handlers) ===================== */
window.P = {
  go,
  setLang(l){ state.lang=l; saveState(); render(); },
  toggleTheme(){ theme = theme==='dark' ? 'light' : 'dark'; localStorage.setItem(THEME_KEY, theme); applyTheme(); render(); },
  setField(path,value){
    setPath(state,path,value); saveState();
  },
  setFieldAndRender(path,value){ this.setField(path,value); render(); },
  wizardNext(){
    const idx = WIZARD_STEPS.indexOf(state.view);
    if(idx < WIZARD_STEPS.length-1){ state.view = WIZARD_STEPS[idx+1]; saveState(); render(); window.scrollTo(0,0); }
  },
  wizardBack(){
    const idx = WIZARD_STEPS.indexOf(state.view);
    if(idx > 0){ state.view = WIZARD_STEPS[idx-1]; saveState(); render(); window.scrollTo(0,0); } else { go('dashboard'); }
  },
  toggleProduct(id){ state.selectedProducts[id] = !state.selectedProducts[id]; saveState(); render(); },
  addGoal(){
    const input = document.getElementById('goalInput');
    if(input && input.value.trim()){ state.project.goals.push(input.value.trim()); input.value=''; saveState(); render(); }
  },
  removeGoal(i){ state.project.goals.splice(i,1); saveState(); render(); },
  addContact(){ state.project.contacts.push({name:'',role:'',email:'',phone:''}); saveState(); render(); },
  removeContact(i){ state.project.contacts.splice(i,1); if(!state.project.contacts.length) state.project.contacts.push({name:'',role:'',email:'',phone:''}); saveState(); render(); },
  setVmField(i,key,value){ state.network.vms[i][key]=value; saveState(); },
  bulkCopyVmCreds(){
    if(!state.network.vms.length) return;
    const { user, password } = state.network.vms[0];
    state.network.vms.forEach(v => { v.user = user; v.password = password; });
    saveState(); render();
  },
  resetStep(){
    const keys = STEP_RESET_KEYS[state.view];
    if(!keys) return;
    if(!confirm(tr('common.resetStepConfirm'))) return;
    const def = defaultState();
    keys.forEach(k => { state[k] = def[k]; });
    saveState(); render();
  },
  addTest(productId){ if(!state.testCases[productId]) state.testCases[productId]=[]; state.testCases[productId].push({id:uid(), text:'', result:'pending', fit:'', led:'', owner:'', evidence:'', notes:''}); saveState(); render(); },
  addVmNetwork(){ state.virtNet.vmNetworks.push({name:'',vlan:'',uplink:''}); saveState(); render(); },
  addClientProduct(){ state.infra.manager.clientProducts.push({name:'',arch:''}); saveState(); render(); },
  addTestVm(){ state.virtInstall.testVms.push({name:'',os:'',cpu:0,ram:0}); saveState(); render(); },
  addGuideTestVms(){
    [['Repo server','CentOS Linux',4,16],['Proxy server','RHEL',4,8],['File server cluster','Windows Server 2022',8,32],['AD server','Windows Server 2022',8,32]]
      .forEach(([name,os,cpu,ram])=>state.virtInstall.testVms.push({name,os,cpu,ram}));
    saveState(); render();
  },
  removeListItem(path,i){
    if(['virtNet.vmNetworks','virtInstall.testVms','infra.manager.clientProducts'].indexOf(path)<0) return;
    getPath(state,path).splice(i,1); saveState(); render();
  },
  setInstallDone(id,checked){
    state.installProgress[id] = !!checked;
    if(checked) state.installDates[id] = todayISO(); else delete state.installDates[id];
    saveState(); render();
  },
  removeTest(productId,i){
    const t = state.testCases[productId][i];
    if(t && t.catalogId && state.testDismissed.indexOf(t.catalogId)<0) state.testDismissed.push(t.catalogId);   // não volta a ser semeado
    state.testCases[productId].splice(i,1); saveState(); render();
  },
  setTestField(productId,i,key,value,rerender){
    const t = state.testCases[productId] && state.testCases[productId][i]; if(!t) return;
    const allowed = { evidence:()=>String(value), notes:()=>String(value), owner:()=>String(value).slice(0,120),
      priority:()=>(value==='must'||value==='nice') ? value : null, fit:()=>(value===''||TEST_FIT[value]) ? value : null, led:()=>(value===''||TEST_LED[value]) ? value : null,
      result:()=>TEST_STATUS[value] ? value : null };
    if(!allowed[key]) return;
    const v = allowed[key](); if(v===null) return;
    t[key] = v; saveState(); if(rerender) render();
  },
  setTestText(productId,i,value){ state.testCases[productId][i].text=value; saveState(); },
  setTestResult(productId,i,result){ if(!TEST_STATUS[result]) return; state.testCases[productId][i].result=result; saveState(); render(); },
  setTestFilter(key,value){ syncTestFilters(); if(key in testFilters){ testFilters[key]=String(value||''); saveTestFilters(); } },
  setTestFilterAndRender(key,value){ this.setTestFilter(key,value); render(); },
  clearTestFilters(){ syncTestFilters(); testFilters = { status:'', fit:'', led:'', owner:'', prio:'' }; saveTestFilters(); render(); },
  togglePort(key){ state.ports.checked[key] = !state.ports.checked[key]; saveState(); render(); },
  newProject(){
    if(confirm(tr('dashboard.resetWarn'))){ createNewProject(); render(); }
  },
  switchProject(id){
    if(id===activeProjectId) return;
    switchToProject(id); render(); window.scrollTo(0,0);
  },
  deleteProject(id){
    if(confirm(tr('projects.deleteConfirm'))){ deleteProjectById(id); render(); }
  },
  printOperatorSheet(){
    document.body.classList.add('print-operator');
    const done = () => { document.body.classList.remove('print-operator'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    window.print();
  },
  exportProject(){
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = (state.project.projectName || 'suse-poc') + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
  exportEib(){
    rebuildVms();
    const combined = buildEibCombinedJson();
    if(!Object.keys(combined).length){
      alert(state.lang==='pt' ? 'Nenhum JSON gerado: selecione Rancher, Security/Storage/Private Registry e/ou Observability, e preencha a rede (Rede & Pool de IPs) antes.' : state.lang==='es' ? 'No se generó ningún JSON: seleccione Rancher, Security/Storage/Private Registry y/u Observability, y complete antes la red (Red & Pool de IPs).' : 'No JSON generated: select Rancher, Security/Storage/Private Registry and/or Observability, and fill in the network (Network & IP Pool) first.');
      return;
    }
    const clientSlug = normClient(state.project.clientOrganization || state.project.projectName);
    const blob = new Blob([JSON.stringify(combined,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = clientSlug+'-eib.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
  importProject(input){
    const file = input.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const imported = normalizeLoadedState(e.target.result);
        if(!imported) throw new Error('invalid');
        state = imported;
        saveState(); render();
      }catch(err){ alert(tr('common.invalidFile')); }
    };
    reader.readAsText(file);
  }
};

document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
