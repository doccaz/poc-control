server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Planejador vendorizado: cópia idêntica do index.html do SUSE PoC Planner (ver scripts/vendor-planner.sh).
    # Sem estas regras, /planner e /planner/ caem no fallback da SPA, que redireciona pra "/"; só o arquivo
    # /planner/index.html seria servido. Servido da mesma origem do /api, o planejador usa o cookie de sessão.
    location = /planner { absolute_redirect off; return 301 /planner/; }
    location /planner/ { try_files $uri $uri/index.html =404; }

    location / {
        try_files $uri /index.html;
    }
}
